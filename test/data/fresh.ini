; edwide_screen: the sides of the game's picture laid over side monitors set at an angle (README.md)
; a line without ';' sets a value; read again within a second of a change
; read when the game starts: 1 = the hook in place; 0 = nothing hooked (the calls only passed on), to tell whether another mod is disturbed by it
;wings_hook = 1
; 1 = the sides laid over monitors set at an angle; 0 = off
;wings = 0
; the side monitors' angle towards you, degrees (0 = in one line with the middle)
;wings_angle = 30
; the middle monitor's width in pixels of the game's picture; 0 = not set (off)
;wings_center_px = 0
; each side monitor's width in pixels; 0 = the rest of the picture (any width)
;wings_side_px = 0
; pixels of the picture behind the bezels between the middle and a side (0 = none)
;wings_bezel_px = 0
; your eyes' distance from the middle monitor, cm (with wings_center_cm: the sides as seen from there; 0 = from the field of view)
;wings_eye_cm = 0
; the middle monitor's picture width, cm (0 = from the field of view)
;wings_center_cm = 0
; only without wings_eye_cm: the game's vertical field of view, degrees; 0 = read from the game's Settings.xml
;wings_fov = 0
; the sides' size: above 1 larger (less black at the corners, more cut off)
;wings_zoom = 1
; 0 flat side monitors .. 1 curved ones
;wings_curve = 0
; the sides moved up (-) or down (+), pixels
;wings_offset_y = 0
; 1 = shapes to set the angle by: circles, squares and rows across the monitors' edges, round, square and straight from where you sit when wings_angle is right
;wings_calibrate = 0
