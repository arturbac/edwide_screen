; my monitors
wings = 1
wings_center_px = 3840
wings_side_px = 2580
wings_angle = 41.4
wings_eye_cm = 80
wings_center_cm = 64

; settings this file did not name yet, added by edwide_screen

; read when the game starts: 1 = the hook in place; 0 = nothing hooked (the calls only passed on), to tell whether another mod is disturbed by it
;wings_hook = 1

; pixels of the picture behind the bezels between the middle and a side (0 = none)
;wings_bezel_px = 0

; only without wings_eye_cm: the game's vertical field of view, degrees; 0 = read from the game's Settings.xml
;wings_fov = 0

; the sides' size: above 1 larger (less black at the corners, more cut off)
;wings_zoom = 1

; 0 flat side monitors .. 1 curved ones
;wings_curve = 0

; the sides moved up (-) or down (+), pixels
;wings_offset_y = 0

; 1 = shapes to set the angle by: circles, squares and rows across the monitors' edges, round, square and straight from where you sit when wings_angle is right
;wings_calibrate = 0
